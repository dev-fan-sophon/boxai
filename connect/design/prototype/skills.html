<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>BoxAI Connect skills</title>
  <link rel="stylesheet" href="./kit.css" />
</head>
<body>
  <div class="page-column">
    <article class="card" data-box="gpui_kit::display::Card">
      <div class="card-header">
        <div class="subtitle">Skills</div>
        <button class="btn">Refresh</button>
      </div>
      <div class="card-body">
        <div class="list-row" data-box="gpui_kit::data::List">
          <div class="grow">
            <div class="label">generating-boxai-images</div>
            <div class="caption">Create images through BoxAI Media</div>
          </div>
          <span class="badge accent">Bundled</span>
          <span class="status"><span class="dot ok"></span>Synced</span>
        </div>
        <div class="list-row" data-box="gpui_kit::data::List">
          <div class="grow">
            <div class="label">using-boxai-gateway</div>
            <div class="caption">Chat models and quota-aware completions</div>
          </div>
          <span class="badge accent">Bundled</span>
          <span class="status"><span class="dot ok"></span>Synced</span>
        </div>
        <div class="list-row" data-box="gpui_kit::data::List">
          <div class="grow">
            <div class="label">studio-notes</div>
            <div class="caption">Available from platform</div>
          </div>
          <span class="tag">1.2.0</span>
          <span class="status"><span class="dot warn"></span>Pending</span>
        </div>
      </div>
    </article>
  </div>
  <script src="./chrome.js"></script>
</body>
</html>

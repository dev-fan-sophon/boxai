[workspace]
resolver = "3"
members = [
  "connector-core",
  "connector-backend",
  "connector-app",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/dev-fan-sophon/boxai"

[workspace.dependencies]
gateway-connector-core = { path = "connector-core" }
gateway-connector-backend = { path = "connector-backend" }
aes-gcm = "0.10"
directories = "6"
fs2 = "0.4"
hkdf = "0.12"
json5 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tiny_http = "0.12"
toml_edit = "0.22"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"
base64 = "0.22"
rand = "0.9"
webbrowser = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }

# Exact reviewed GPUI Box revision. Source imports stay `gpui` / `gpui_kit`.
gpui = { package = "gpui-box", git = "https://github.com/fran0220/gpui-box", rev = "1e5bb24995d7531e32f7dec1658e0cd49db472ff" }
gpui_platform = { package = "gpui-box-platform", git = "https://github.com/fran0220/gpui-box", rev = "1e5bb24995d7531e32f7dec1658e0cd49db472ff", features = ["font-kit"] }
gpui-kit = { package = "gpui-box-kit", git = "https://github.com/fran0220/gpui-box", rev = "1e5bb24995d7531e32f7dec1658e0cd49db472ff" }
gpui-kit-semantics = { package = "gpui-box-kit-semantics", git = "https://github.com/fran0220/gpui-box", rev = "1e5bb24995d7531e32f7dec1658e0cd49db472ff" }
gpui-kit-theme = { package = "gpui-box-kit-theme", git = "https://github.com/fran0220/gpui-box", rev = "1e5bb24995d7531e32f7dec1658e0cd49db472ff" }
gpui-kit-tokens = { package = "gpui-box-kit-tokens", git = "https://github.com/fran0220/gpui-box", rev = "1e5bb24995d7531e32f7dec1658e0cd49db472ff" }
ed25519-dalek = "2"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"

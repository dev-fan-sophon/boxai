[package]
name = "gateway-connector-app"
description = "BoxAI Connect GPUI application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"
publish = false

[features]
default = ["gpui-app"]
gpui-app = [
  "dep:gpui",
  "dep:gpui-kit",
  "dep:gpui-kit-semantics",
  "dep:gpui-kit-theme",
  "dep:gpui_platform",
]

[dependencies]
directories.workspace = true
fs2.workspace = true
gateway-connector-backend.workspace = true
gateway-connector-core.workspace = true
gpui = { workspace = true, optional = true }
gpui-kit = { workspace = true, optional = true }
gpui-kit-semantics = { workspace = true, optional = true }
gpui-kit-theme = { workspace = true, optional = true }
gpui-kit-tokens.workspace = true
gpui_platform = { workspace = true, optional = true }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[build-dependencies]
serde_json.workspace = true
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true
tiny_http.workspace = true
zip.workspace = true

[[bin]]
name = "boxai-connect"
path = "src/main.rs"
required-features = ["gpui-app"]

[lints]
workspace = true

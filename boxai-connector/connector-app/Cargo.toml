[package]
name = "connector-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "boxai-connector"
path = "src/main.rs"
required-features = ["gpui-app"]

[features]
default = []
gpui-app = ["dep:gpui", "dep:gpui_platform", "dep:gpui-kit"]

[dependencies]
base64 = "0.22"
connector-core = { path = "../connector-core" }
directories = "6"
fs2 = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
webbrowser = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
gpui = { git = "https://github.com/fran0220/zed", rev = "0d6f50bbac07b76688e5471b932b12412d256a9a", optional = true }
gpui_platform = { git = "https://github.com/fran0220/zed", rev = "0d6f50bbac07b76688e5471b932b12412d256a9a", features = ["font-kit"], optional = true }
gpui-kit = { git = "https://github.com/fran0220/gpui-kit", rev = "1aaa85b23fc47d4d893aca736c0e54ce9e5e07b0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

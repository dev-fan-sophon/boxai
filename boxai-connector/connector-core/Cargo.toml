[package]
name = "connector-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.10"
fs2 = "0.4"
hkdf = "0.12"
json5 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml_edit = "0.22"
url = { version = "2", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

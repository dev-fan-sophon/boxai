<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BoxAI · API Keys (fixture)</title>
    <link rel="stylesheet" href="./console-shell.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">BoxAI</div>
        <nav class="nav">
          <a href="#">Dashboard</a>
          <a class="active" href="#">API Keys</a>
          <a href="#">Model Hub</a>
          <a href="#">Billing</a>
          <a href="#">Usage</a>
          <a href="#">Playground</a>
        </nav>
      </aside>
      <main class="main">
        <div class="top">
          <div>
            <h1>API Keys</h1>
            <p class="muted" style="margin: 6px 0 0">
              Issue keys for server-side calls to you-box.com
            </p>
          </div>
          <button class="btn" type="button">Create API key</button>
        </div>
        <div class="card" style="padding: 48px; text-align: center">
          <div style="font-size: 40px; margin-bottom: 8px">🔑</div>
          <h2 style="margin: 0 0 8px; font-size: 18px">No API Keys Found</h2>
          <p class="muted" style="margin: 0 auto; max-width: 420px">
            No API keys available. Create your first API key to get started.
          </p>
          <p style="margin-top: 16px">
            <button class="btn" type="button">Create API key</button>
          </p>
          <p class="muted" style="margin-top: 14px; font-size: 13px">
            How to create an API key → docs
          </p>
        </div>
      </main>
    </div>
  </body>
</html>

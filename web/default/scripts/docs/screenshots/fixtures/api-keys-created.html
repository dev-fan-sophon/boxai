<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BoxAI · API key created (fixture)</title>
    <link rel="stylesheet" href="./console-shell.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">BoxAI</div>
        <nav class="nav">
          <a class="active" href="#">API Keys</a>
          <a href="#">Billing</a>
          <a href="#">Usage</a>
        </nav>
      </aside>
      <main class="main">
        <div class="top"><h1>API Keys</h1></div>
      </main>
    </div>
    <div class="dialog-backdrop">
      <div class="dialog">
        <h2>API key created</h2>
        <p class="muted" style="margin: 0">
          Copy the secret now. It is shown only once.
        </p>
        <div class="field" style="margin-top: 14px">
          <label>Secret</label>
          <div class="secret">sk-boxai-••••••••••••••••••••REDACTED</div>
        </div>
        <div class="callout">
          Never put this key in browser code, mobile apps, or public repos. Store
          it as <span class="mono">BOXAI_API_KEY</span> on your server.
        </div>
        <div class="actions">
          <button class="btn outline" type="button">Copy</button>
          <button class="btn" type="button">Done</button>
        </div>
      </div>
    </div>
  </body>
</html>

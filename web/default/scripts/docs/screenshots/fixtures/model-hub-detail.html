<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BoxAI · Model detail (fixture)</title>
    <link rel="stylesheet" href="./console-shell.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">BoxAI</div>
        <nav class="nav">
          <a href="#">API Keys</a>
          <a class="active" href="#">Model Hub</a>
          <a href="#">Billing</a>
        </nav>
      </aside>
      <main class="main">
        <div class="top">
          <div>
            <p class="muted" style="margin: 0 0 6px">Model Hub / detail</p>
            <h1 class="mono" style="font-size: 22px">gpt-demo-mini</h1>
          </div>
          <button class="btn outline" type="button">Copy model ID</button>
        </div>
        <div class="cols-3 grid" style="margin-bottom: 16px">
          <div class="stat">
            <div class="label">Input</div>
            <div class="value" style="font-size: 18px">$0.15 / 1M</div>
          </div>
          <div class="stat">
            <div class="label">Output</div>
            <div class="value" style="font-size: 18px">$0.60 / 1M</div>
          </div>
          <div class="stat">
            <div class="label">Context</div>
            <div class="value" style="font-size: 18px">128k</div>
          </div>
        </div>
        <div class="card" style="padding: 16px">
          <h2 style="margin: 0 0 10px; font-size: 16px">Use this exact ID</h2>
          <div class="secret">gpt-demo-mini</div>
          <p class="muted" style="margin: 12px 0 0; font-size: 13px">
            Availability depends on your group. Always copy the ID from Model
            Hub — do not invent aliases.
          </p>
        </div>
      </main>
    </div>
  </body>
</html>

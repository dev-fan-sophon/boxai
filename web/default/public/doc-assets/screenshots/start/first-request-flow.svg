  <rect x="850" y="70" width="70" height="80" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <text x="885" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#0f172a">200</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>

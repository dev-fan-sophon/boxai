<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-labelledby="lockup-title">
  <title id="lockup-title">BoxAI</title>
  <!-- Spiral mark (simplified) + wordmark; for dark surfaces -->
  <g transform="translate(4 4)">
    <image href="/logo.svg" width="56" height="56" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g transform="translate(72 8)">
    <text
      x="0"
      y="34"
      font-family="ui-sans-serif, system-ui, 'Public Sans', 'Segoe UI', sans-serif"
      font-size="32"
      font-weight="650"
      letter-spacing="-1.5"
      fill="#F7F8FA"
    >Box</text>
    <text
      x="70"
      y="34"
      font-family="ui-sans-serif, system-ui, 'Public Sans', 'Segoe UI', sans-serif"
      font-size="32"
      font-weight="750"
      letter-spacing="-2"
      fill="url(#lockup-ai)"
    >AI</text>
  </g>
  <defs>
    <linearGradient id="lockup-ai" x1="70" y1="6" x2="140" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9A6B"/>
      <stop offset="0.5" stop-color="#F08050"/>
      <stop offset="1" stop-color="#E05A3A"/>
    </linearGradient>
  </defs>
</svg>

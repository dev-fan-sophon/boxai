name: Connect Release

on:
  push:
    tags: ["connect-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: connect
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: connect
      - name: Install NSIS and 7-Zip
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install nsis 7zip -y --no-progress
      - name: Verify tag version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/connect-v* ]]; then
            version="$(python3 -c 'import json; print(json.load(open("release-metadata.json"))["version"])')"
            test "${GITHUB_REF_NAME#connect-v}" = "$version"
          fi
      - name: Build and assert macOS arm64 DMG
        if: runner.os == 'macOS'
        run: bash packaging/macos/stage-release.sh
      - name: Build and assert Windows x64 setup
        if: runner.os == 'Windows'
        shell: powershell
        run: ./packaging/windows/stage-release.ps1
      - name: Resolve release version
        shell: bash
        run: echo "CONNECT_VERSION=$(python3 -c 'import json; print(json.load(open("release-metadata.json"))["version"])')" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connect-${{ matrix.platform }}
          path: connect/release/${{ env.CONNECT_VERSION }}/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/connect-v')
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve release version
        run: echo "CONNECT_VERSION=$(python3 -c 'import json; print(json.load(open("connect/release-metadata.json"))["version"])')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: connect/release/${{ env.CONNECT_VERSION }}
          merge-multiple: true
      - name: Prepare Ed25519 update signing key
        env:
          SIGNING_KEY: ${{ secrets.BOXAI_CONNECT_UPDATE_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "::error::BOXAI_CONNECT_UPDATE_SIGNING_KEY is required"; exit 1; }
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/connect-update-signing.pem"
          echo "BOXAI_CONNECT_UPDATE_SIGNING_KEY=$RUNNER_TEMP/connect-update-signing.pem" >> "$GITHUB_ENV"
      - name: Publish complete signed update feed to R2
        env:
          BOXAI_CLOUDFLARE_ENV: /dev/null
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_DESKTOP_ACCESS_KEY_ID: ${{ secrets.R2_DESKTOP_ACCESS_KEY_ID }}
          R2_DESKTOP_SECRET_ACCESS_KEY: ${{ secrets.R2_DESKTOP_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: bash connect/packaging/publish_release.sh

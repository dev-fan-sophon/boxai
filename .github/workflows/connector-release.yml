name: Connector Release
on:
  push:
    tags: ["connector-v*"]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    environment: production
    defaults:
      run:
        working-directory: boxai-connector
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.0"
      - name: Verify tag version
        run: test "${GITHUB_REF_NAME#connector-v}" = "$(python3 -c 'import json; print(json.load(open("connector-release.json"))["version"])')"
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --features connector-app/gpui-app --bin boxai-connector
      - run: bash packaging/stage_release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connector-macos-arm64
          path: boxai-connector/release/*/*
          if-no-files-found: error
      # Publishing is intentionally a separate, manually approved operation:
      # make connector-publish after signing/notarizing and supplying R2 credentials.
  windows:
    runs-on: windows-2025
    environment: production
    defaults:
      run:
        working-directory: boxai-connector
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.0"
      - name: Verify tag version
        shell: pwsh
        run: |
          $release = Get-Content connector-release.json | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME.Substring(11) -ne $release.version) { throw "tag/version mismatch" }
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --features connector-app/gpui-app --bin boxai-connector
      - shell: pwsh
        run: ./packaging/stage_release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connector-windows-x64
          path: boxai-connector/release/*/*
          if-no-files-found: error

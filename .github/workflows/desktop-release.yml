name: Desktop release
on:
  push:
    tags: ['desktop-v*']
permissions:
  contents: read
concurrency:
  group: desktop-production-release
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify release tag and main ancestry
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          test "$GITHUB_REF_NAME" = "desktop-v$(node -p 'require("./desktop/apps/desktop/package.json").version')"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm dist
        working-directory: desktop
      - run: node scripts/client-release/desktop-native.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-native-${{ matrix.os }}
          path: desktop/release/
          if-no-files-found: error
  publish:
    needs: native
    runs-on: ubuntu-latest
    environment: desktop-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-native-*
          merge-multiple: true
          path: desktop/release/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/client-release/requirements.txt
      - run: python -m unittest discover -s scripts/client-release -p desktop_release_test.py
      - run: python scripts/client-release/desktop_release.py --publish
        env:
          R2_DESKTOP_ACCESS_KEY_ID: ${{ secrets.R2_DESKTOP_ACCESS_KEY_ID }}
          R2_DESKTOP_SECRET_ACCESS_KEY: ${{ secrets.R2_DESKTOP_SECRET_ACCESS_KEY }}
          BOXAI_CLOUDFLARE_API_TOKEN: ${{ secrets.BOXAI_CLOUDFLARE_API_TOKEN }}

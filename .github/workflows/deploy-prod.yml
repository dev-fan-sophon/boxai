name: Deploy production

# Pushes validate only. Production requires manual dispatch of an immutable
# commit, successful validation, and approval of the production environment.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Full 40-character main commit SHA to release (not a branch/tag)"
        required: true
        type: string
      bootstrap:
        description: "Run first-time host bootstrap"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate release candidate (no production access)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve immutable release candidate
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          REQUESTED_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$WORKFLOW_REF" == "refs/heads/main" ]] || { echo "Run this workflow from main" >&2; exit 1; }
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A full lowercase commit SHA is required" >&2; exit 1; }
            git cat-file -e "${REQUESTED_SHA}^{commit}"
            git merge-base --is-ancestor "$REQUESTED_SHA" origin/main
            SHA="$REQUESTED_SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Verify release approval guard
        run: |
          bash -n scripts/check-production-approval.sh
          python3 scripts/check-production-approval_test.py

      - name: Require configured production approval
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-production-approval.sh

      - name: Checkout release candidate
        env:
          RELEASE_SHA: ${{ steps.meta.outputs.sha }}
        run: git checkout --detach "$RELEASE_SHA"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Verify deployment and monitoring contracts
        run: |
          bash -n scripts/deploy-prod.sh scripts/deploy-web.sh scripts/server/start-infra.sh
          python3 scripts/server/start-infra_test.py
          node --test workers/health-monitor/index.test.mjs

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Verify frontend quality
        working-directory: web/default
        run: |
          set -euo pipefail
          bun run format:check
          bun run lint
          bun run typecheck
          bun x vitest run scripts/docs/build-content.test.ts
          git diff --exit-code -- public/doc-assets src/features/docs/generated

      - name: Release candidate summary
        env:
          RELEASE_SHA: ${{ steps.meta.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -euo pipefail
          {
            echo "## Validated release candidate"
            echo "Commit: [${RELEASE_SHA}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${RELEASE_SHA})"
            echo "Bootstrap: ${BOOTSTRAP:-false}"
            if [[ "$EVENT_NAME" == "push" ]]; then
              echo "Validation only. Nothing was deployed. Manually run Deploy production with this SHA to request release approval."
            else
              echo "Review this commit, then approve the production environment to allow SSH, migrations, service restarts and public cutover."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Approve and release to production
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://you-box.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - name: Checkout release policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Recheck production approval policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-production-approval.sh

      - name: Checkout validated commit
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: git checkout --detach "$RELEASE_SHA"

      - name: Deploy
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          BOXAI_SSH_HOST: ${{ secrets.BOXAI_SSH_HOST }}
          BOXAI_SSH_USER: ${{ secrets.BOXAI_SSH_USER }}
          BOXAI_SSH_PORT: ${{ secrets.BOXAI_SSH_PORT }}
          BOXAI_SSH_PRIVATE_KEY: ${{ secrets.BOXAI_SSH_PRIVATE_KEY }}
          BOXAI_SSH_HOST_KEY: ${{ secrets.BOXAI_SSH_HOST_KEY }}
          BOXAI_BASE_URL: ${{ secrets.BOXAI_BASE_URL }}
        run: |
          set -euo pipefail
          : "${BOXAI_SSH_HOST:?missing secret BOXAI_SSH_HOST}"
          : "${BOXAI_SSH_USER:?missing secret BOXAI_SSH_USER}"
          : "${BOXAI_SSH_PRIVATE_KEY:?missing secret BOXAI_SSH_PRIVATE_KEY}"
          : "${BOXAI_SSH_HOST_KEY:?missing secret BOXAI_SSH_HOST_KEY}"
          ARGS=(--ref "$RELEASE_SHA")
          if [[ "$BOOTSTRAP" == "true" ]]; then
            ARGS+=(--bootstrap)
          fi
          bash ./scripts/deploy-prod.sh "${ARGS[@]}"

      - name: Public health check
        env:
          BOXAI_BASE_URL: ${{ secrets.BOXAI_BASE_URL }}
        run: |
          set -euo pipefail
          BASE="${BOXAI_BASE_URL:-https://you-box.com}"
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors \
            "${BASE%/}/api/status" | head -c 300
          echo
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors \
            "${BASE%/}/chat-api/readyz" | head -c 300
          echo

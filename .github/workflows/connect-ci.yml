name: Connect CI

on:
  push:
    paths: ["connect/**", ".github/workflows/connect-ci.yml"]
  pull_request:
    paths: ["connect/**", ".github/workflows/connect-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connect
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: connect/go.mod
          cache-dependency-path: connect/go.sum
      - name: Install Wails Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: make test cli build
      - run: python3 packaging/build_catalog.py
      - name: Check pinned provenance
        run: |
          grep -q 'MIT License' LICENSE.magpie
          grep -q 'Apache License' LICENSE
          grep -q '03a01a548df3d52fee86197fc2d0ff234b9fdfab' UPSTREAM.md

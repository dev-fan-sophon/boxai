name = "boxai-health-monitor"
main = "index.mjs"
compatibility_date = "2026-09-29"
account_id = "4379d21a3d3eadc0e37d63abff091f31"
workers_dev = true

[triggers]
crons = ["*/2 * * * *"]

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "boxai-backup"

[[send_email]]
name = "EMAIL"

# Set ALERT_FROM, ALERT_TO and CHECK_TOKEN with Wrangler secrets before enabling
# the schedule. CHECK_TOKEN gates manual probes; no public status data is exposed.
